openapi: 3.1.0
info:
  title: Identity Resources Management API
  version: 1.0.0
  description: CQRS HTTP contract for searching and managing Resources.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/resources/search:
    post:
      operationId: searchResources
      x-access-requirement: Resources.View
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchResourcesRequest' }
      responses:
        '200':
          description: Matching page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedResourcesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/resources:
    post:
      operationId: createResource
      x-access-requirement: Resources.Create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getResourceById
      x-access-requirement: Resources.View
      responses:
        '200':
          description: Resource detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      operationId: updateResource
      x-access-requirement: Resources.Update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateResourceRequest' }
      responses:
        '200':
          description: Updated Resource with incremented Version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      operationId: deleteResource
      x-access-requirement: Resources.Delete
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Resource soft-deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    StringFilter:
      type: object
      additionalProperties: false
      properties:
        contains: { type: [string, 'null'] }
        startsWith: { type: [string, 'null'] }
        endsWith: { type: [string, 'null'] }
        values:
          type: [array, 'null']
          items: { type: string }
    ResourcesFilter:
      type: [object, 'null']
      additionalProperties: false
      properties:
        applicationId: { type: [integer, 'null'], format: int64, minimum: 1 }
        application: { $ref: '#/components/schemas/StringFilter' }
        code: { $ref: '#/components/schemas/StringFilter' }
        name: { $ref: '#/components/schemas/StringFilter' }
        resourceType: { $ref: '#/components/schemas/StringFilter' }
        isActive: { type: [boolean, 'null'] }
    ResourceSort:
      type: object
      required: [column, direction]
      additionalProperties: false
      properties:
        column:
          type: integer
          enum: [0, 1, 2, 3, 4, 5, 6]
          description: 0 Id, 1 Application, 2 Code, 3 Name, 4 ResourceType, 5 CreatedDate, 6 IsActive
        direction:
          type: integer
          enum: [0, 1]
          description: 0 ascending, 1 descending
    SearchResourcesRequest:
      type: object
      additionalProperties: false
      properties:
        filter: { $ref: '#/components/schemas/ResourcesFilter' }
        sorts:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/ResourceSort' }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CreateResourceRequest:
      type: object
      required: [applicationId, code, name, resourceType]
      additionalProperties: false
      properties:
        applicationId: { type: integer, format: int64, minimum: 1 }
        code: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 150 }
        resourceType: { type: string, minLength: 1, maxLength: 30 }
        description: { type: [string, 'null'], maxLength: 500 }
    UpdateResourceRequest:
      allOf:
        - $ref: '#/components/schemas/CreateResourceRequest'
        - type: object
          required: [isActive, version]
          properties:
            isActive: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
    Resource:
      type: object
      required: [id, applicationId, applicationCode, applicationName, code, name, resourceType, description, createdDate, isActive, version]
      properties:
        id: { type: integer, format: int64 }
        applicationId: { type: integer, format: int64 }
        applicationCode: { type: string }
        applicationName: { type: string }
        code: { type: string }
        name: { type: string }
        resourceType: { type: string }
        description: { type: [string, 'null'] }
        createdDate: { type: string, format: date-time }
        isActive: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    PagedResources:
      type: object
      required: [items, totalCount, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        totalCount: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    ResourceResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Resource' }
        message: { type: string }
    PagedResourcesResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PagedResources' }
        message: { type: string }
    EmptyResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { type: 'null' }
        message: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
  responses:
    ValidationError:
      description: Invalid request; field keys use camelCase
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Unauthorized:
      description: Missing, invalid or expired authentication
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Principal lacks endpoint permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource is absent or deleted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Duplicate Code, stale Version, invalid Application state or blocking dependency
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Problem'
              - $ref: '#/components/schemas/ValidationProblem'
    ServerError:
      description: Unexpected safe failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
