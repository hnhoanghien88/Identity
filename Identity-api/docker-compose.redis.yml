services:
  redis:
    image: redis:7.4-alpine
    container_name: identity-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - identity-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  identity-redis-data:
