openapi: 3.1.0
info:
  title: Identity Applications Management API
  version: 1.0.0
  description: CQRS HTTP contract for searching and managing Applications.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/applications/search:
    post:
      operationId: searchApplications
      summary: Search non-deleted Applications
      x-access-requirement: AuthenticatedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchApplicationsRequest'
      responses:
        '200':
          description: Matching page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApplicationsResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/applications:
    post:
      operationId: createApplication
      summary: Create an Application
      x-access-requirement: AuthenticatedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Created; Location identifies the detail resource
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplicationById
      summary: Get a non-deleted Application
      x-access-requirement: AuthenticatedUser
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      operationId: updateApplication
      summary: Update an Application using optimistic concurrency
      x-access-requirement: AuthenticatedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Updated Application with incremented Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      operationId: deleteApplication
      summary: Soft-delete an unreferenced Application
      x-access-requirement: AuthenticatedUser
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Application soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    StringFilter:
      type: object
      additionalProperties: false
      properties:
        contains: { type: [string, 'null'] }
        startsWith: { type: [string, 'null'] }
        endsWith: { type: [string, 'null'] }
        values:
          type: [array, 'null']
          items: { type: string }
    ApplicationsFilter:
      type: [object, 'null']
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/StringFilter' }
        name: { $ref: '#/components/schemas/StringFilter' }
        audience: { $ref: '#/components/schemas/StringFilter' }
        isActive: { type: [boolean, 'null'] }
    ApplicationSort:
      type: object
      required: [column, direction]
      additionalProperties: false
      properties:
        column:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]
          description: 0 Id, 1 Code, 2 Name, 3 Audience, 4 CreatedDate, 5 IsActive
        direction:
          type: integer
          enum: [0, 1]
          description: 0 ascending, 1 descending
    SearchApplicationsRequest:
      type: object
      additionalProperties: false
      properties:
        filter: { $ref: '#/components/schemas/ApplicationsFilter' }
        sorts:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/ApplicationSort' }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CreateApplicationRequest:
      type: object
      required: [code, name, audience]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 150 }
        audience: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 500 }
    UpdateApplicationRequest:
      allOf:
        - $ref: '#/components/schemas/CreateApplicationRequest'
        - type: object
          required: [isActive, version]
          properties:
            isActive: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
    Application:
      type: object
      required: [id, code, name, audience, description, createdDate, isActive, version]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        audience: { type: string }
        description: { type: [string, 'null'] }
        createdDate: { type: string, format: date-time }
        isActive: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    PagedApplications:
      type: object
      required: [items, totalCount, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Application' }
        totalCount: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    ApplicationResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Application' }
        message: { type: string }
    PagedApplicationsResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PagedApplications' }
        message: { type: string }
    EmptyResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { type: 'null' }
        message: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
  responses:
    ValidationError:
      description: Invalid request; field keys use camelCase
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Unauthorized:
      description: Missing, invalid or expired authentication
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated principal lacks the endpoint permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Application is absent or deleted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Duplicate Code, stale Version or blocking dependency; no internal details
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Problem'
              - $ref: '#/components/schemas/ValidationProblem'
    ServerError:
      description: Unexpected safe failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
